# AI Tunnel uses outbound HTTPS; no local model or GPU container is required.
services:
  app:
    environment:
      PHOTO_REVIEW_PROVIDER: aitunnel
      FORECAST_PROVIDER: aitunnel
      AITUNNEL_API_KEY: ${AITUNNEL_API_KEY:-${AI_TUNNEL_API_KEY:-}}
      AITUNNEL_BASE_URL: ${AITUNNEL_BASE_URL:-https://api.aitunnel.ru/v1/}
      AITUNNEL_VISION_MODEL: ${AITUNNEL_VISION_MODEL:-qwen3.7-flash}
      AITUNNEL_FORECAST_MODEL: ${AITUNNEL_FORECAST_MODEL:-qwen3.7-flash}
      AITUNNEL_TIMEOUT_SECONDS: ${AITUNNEL_TIMEOUT_SECONDS:-90}
      AITUNNEL_REASONING_EFFORT: ${AITUNNEL_REASONING_EFFORT:-none}
      PHOTO_REVIEW_TIMEOUT_SECONDS: ${PHOTO_REVIEW_TIMEOUT_SECONDS:-120}
      FORECAST_TIMEOUT_SECONDS: ${FORECAST_TIMEOUT_SECONDS:-100}
