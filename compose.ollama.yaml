# Native Ollama on the host; no inference port is exposed by the application.
services:
  app:
    environment:
      ASSISTANT_PROVIDER: ollama
      OLLAMA_CHAT_BASE_URL: ${OLLAMA_CHAT_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen3.5:4b-q4_K_M}
      OLLAMA_CHAT_DIGEST: ${OLLAMA_CHAT_DIGEST:?Pin the downloaded local model manifest}
      OLLAMA_CHAT_NUM_CTX: ${OLLAMA_CHAT_NUM_CTX:-32768}
      OLLAMA_CHAT_TIMEOUT_SECONDS: ${OLLAMA_CHAT_TIMEOUT_SECONDS:-240}
      PHOTO_REVIEW_PROVIDER: ollama
      FORECAST_PROVIDER: rf
      OLLAMA_BASE_URL: ${OLLAMA_CHAT_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_VISION_MODEL: ${OLLAMA_CHAT_MODEL:-qwen3.5:4b-q4_K_M}
      OLLAMA_VISION_DIGEST: ${OLLAMA_CHAT_DIGEST:?Pin the downloaded local model manifest}
      PHOTO_REVIEW_TIMEOUT_SECONDS: "120"
      FORECAST_TIMEOUT_SECONDS: "2"
