map $http_upgrade $office_connection {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name localhost;
    if ($host != localhost) { return 421; }
    access_log off;
    client_max_body_size 16m;

    location /fixrate-office/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff";
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; frame-src 'self'; style-src 'self' 'unsafe-inline'; frame-ancestors http://127.0.0.1:*; base-uri 'none'; form-action 'none'";
    }

    add_header Permissions-Policy "camera=(), microphone=(), display-capture=()" always;

    location ~* /(?:command(?:service\.ashx)?|convert(?:service\.ashx)?|docbuilder|example)(?:/|$) {
        return 404;
    }

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $office onlyoffice:80;
        proxy_pass http://$office;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header Cookie "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $office_connection;
        proxy_read_timeout 120s;
        proxy_hide_header Set-Cookie;
    }
}
