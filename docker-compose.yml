# Локальный PostgreSQL для разработки. ТОЛЬКО БД: API запускается через uvicorn (см. backend/README.md).
# Схему здесь НЕ создаём: таблицы придут из официального DDL архитектора БД (папка db/).
# Пароль — локальная заглушка; переопределяется переменной POSTGRES_PASSWORD.
services:
  postgres:
    image: pgvector/pgvector:pg16   # PostgreSQL 16 + расширение pgvector (для будущего RAG)
    container_name: fixrate_postgres
    environment:
      POSTGRES_DB: fixrate
      POSTGRES_USER: fixrate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeMe-local-only}
    # Хост-порт можно переопределить, если 5432 занят локальным PostgreSQL:
    #   POSTGRES_PORT=5433 docker compose up -d
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - fixrate_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixrate -d fixrate"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  fixrate_pgdata:
