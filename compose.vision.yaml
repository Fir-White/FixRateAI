# Offline photo reasoning service: use after scripts/prepare_local_vision.py.
services:
  vision:
    image: ${OLLAMA_IMAGE:?Prepare and pin the local vision image}
    pull_policy: never
    gpus: all
    environment:
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_CONTEXT_LENGTH: "4096"
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0
    volumes:
      - vision_models:/root/.ollama
    networks:
      - vision
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
  app:
    environment:
      PHOTO_REVIEW_PROVIDER: ollama
      PHOTO_REVIEW_TIMEOUT_SECONDS: "120"
      OLLAMA_BASE_URL: http://vision:11434
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:?Prepare the local vision model}
      OLLAMA_VISION_DIGEST: ${OLLAMA_VISION_DIGEST:?Pin the local vision model manifest}
    networks:
      - default
      - vision
    depends_on:
      vision:
        condition: service_healthy
volumes:
  vision_models:
    external: true
    name: fixrate-local_vision_models
networks:
  default: {}
  vision:
    internal: true
