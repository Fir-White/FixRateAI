name: Sync GitHub and GitVerse

on:
  push:
    branches: ['**']
    tags: ['**']
  create:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/gitverse-sync.yml'
      - '.gitverse/workflows/github-sync.yml'
      - 'scripts/run_git_host_sync.sh'
      - 'scripts/sync_git_hosts.py'
      - 'tests/automation/test_git_host_sync.py'
  schedule:
    - cron: '2-59/5 * * * *'

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'pull_request' && github.repository == 'Fir-White/FixRateAI'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check the entrypoint and exercise local Git remotes
        run: |
          bash -n scripts/run_git_host_sync.sh
          python -m pip install pytest==9.1.1
          python -B -m pytest -o addopts= -q tests/automation/test_git_host_sync.py

  sync:
    if: github.event_name != 'pull_request' && github.repository == 'Fir-White/FixRateAI'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: gitverse-sync
      cancel-in-progress: false
    steps:
      - name: Load synchronization code from the control branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            scripts/sync_git_hosts.py
            scripts/run_git_host_sync.sh
          sparse-checkout-cone-mode: false
      - name: Reconcile branches and tags in both directions
        shell: bash
        env:
          GITVERSE_USERNAME: ${{ secrets.GITVERSE_USERNAME }}
          GITVERSE_TOKEN: ${{ secrets.GITVERSE_TOKEN }}
          GH_MIRROR_SSH_KEY: ${{ secrets.GH_MIRROR_SSH_KEY }}
        run: bash scripts/run_git_host_sync.sh
