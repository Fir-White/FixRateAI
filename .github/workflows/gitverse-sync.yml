name: Sync GitHub and GitVerse

on:
  push:
    branches: ['**']
    tags: ['**']
  create:
  workflow_dispatch:
  schedule:
    - cron: '2-59/5 * * * *'

permissions:
  contents: read

concurrency:
  group: gitverse-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'Fir-White/FixRateAI'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Load synchronization code from the control branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            scripts/sync_git_hosts.py
            scripts/run_git_host_sync.sh
          sparse-checkout-cone-mode: false
      - name: Reconcile branches and tags in both directions
        shell: bash
        env:
          GITVERSE_USERNAME: ${{ secrets.GITVERSE_USERNAME }}
          GITVERSE_TOKEN: ${{ secrets.GITVERSE_TOKEN }}
          GH_MIRROR_SSH_KEY: ${{ secrets.GH_MIRROR_SSH_KEY }}
        run: bash scripts/run_git_host_sync.sh
