# Standalone runtime for a prebuilt image with RF and CLIP weights inside.
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: fixrate
      POSTGRES_USER: fixrate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a unique URL-safe database password}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixrate -d fixrate"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    image: ${FIXRATE_IMAGE:-fixrate-ai:bundled}
    environment:
      DATABASE_URL: postgresql+psycopg://fixrate:${POSTGRES_PASSWORD:?Set a unique URL-safe database password}@db:5432/fixrate
      PHOTO_STORAGE_ROOT: /app/var/photos
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      HF_HOME: /app/model-cache
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      PHOTO_REVIEW_TIMEOUT_SECONDS: ${PHOTO_REVIEW_TIMEOUT_SECONDS:-20}
      FORECAST_TIMEOUT_SECONDS: ${FORECAST_TIMEOUT_SECONDS:-2}
      PHOTO_REVIEW_MAX_FILES: ${PHOTO_REVIEW_MAX_FILES:-20}
      PHOTO_REVIEW_MAX_BYTES: ${PHOTO_REVIEW_MAX_BYTES:-52428800}
    ports:
      - "127.0.0.1:${FIXRATE_PORT:-8000}:8000"
    volumes:
      - photos:/app/var/photos
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6
volumes:
  postgres_data:
  photos:
