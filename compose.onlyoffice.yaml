services:
  app:
    image: fixrate-ai:onlyoffice-local
    networks: [default, private, office]
    environment:
      FIXRATE_OFFICE_BROWSER_ORIGIN: http://localhost:${FIXRATE_OFFICE_PORT:-8092}
      FIXRATE_OFFICE_INTERNAL_ORIGIN: http://onlyoffice
      FIXRATE_OFFICE_CALLBACK_ORIGIN: http://app:8000
      FIXRATE_OFFICE_SECRET: ${FIXRATE_OFFICE_SECRET:?Set a unique local ONLYOFFICE JWT secret}
  onlyoffice:
    image: onlyoffice/documentserver:10.0.0@sha256:ca17889f10b11141cc6441836aebdd2835cf3e1b49681b2fd6e155c94b7850b3
    networks: [office]
    shm_size: 512m
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${FIXRATE_OFFICE_SECRET:?Set a unique local ONLYOFFICE JWT secret}
      JWT_IN_BODY: "false"
      WELCOME_PAGE_ENABLED: "false"
      EXAMPLE_ENABLED: "false"
      NODE_CONFIG: >-
        {"externalRequest":{"directIfIn":{"allowList":["http://app:8000/api/internal/workbook-editor/"]},"action":{"allow":false}}}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/healthcheck | grep -qx true"]
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 15
  office-browser:
    image: nginx:1.28.3-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    networks: [office, office-browser]
    ports:
      - "127.0.0.1:${FIXRATE_OFFICE_PORT:-8092}:80"
    volumes:
      - ./docker/onlyoffice-browser.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/onlyoffice-bridge:/usr/share/nginx/html/fixrate-office:ro
    depends_on:
      onlyoffice:
        condition: service_healthy
networks:
  office:
    internal: true
  office-browser: {}
